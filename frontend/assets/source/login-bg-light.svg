<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200">
  <!-- 登录页定制背景 · 亮色模式（设计源文件）
       构图：中轴留白（登录卡区域）｜左下·矿石晶簇肌理｜右上·钢铁线稿
       规范：低饱和蓝灰调、Apple 极简、背景元素透明度 ≤16% 不干扰前景 -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafd"/>
      <stop offset=".55" stop-color="#f1f4fa"/>
      <stop offset="1" stop-color="#e9eef7"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx=".16" cy=".04" r=".85">
      <stop offset="0" stop-color="#0a84ff" stop-opacity=".10"/>
      <stop offset=".55" stop-color="#0a84ff" stop-opacity=".03"/>
      <stop offset="1" stop-color="#0a84ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowIndigo" cx=".9" cy=".98" r=".8">
      <stop offset="0" stop-color="#5e5ce6" stop-opacity=".08"/>
      <stop offset="1" stop-color="#5e5ce6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lightBand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="oreFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fa6c6" stop-opacity=".07"/>
      <stop offset="1" stop-color="#6d84a8" stop-opacity=".03"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <!-- L1 基底渐变 + 氛围光 -->
  <rect width="1920" height="1200" fill="url(#base)"/>
  <rect width="1920" height="1200" fill="url(#glowBlue)"/>
  <rect width="1920" height="1200" fill="url(#glowIndigo)"/>

  <!-- 斜向光带（柔化空间层次） -->
  <polygon points="480,-80 760,-80 1440,1280 1160,1280" fill="url(#lightBand)" opacity=".10"/>

  <!-- 矿石：低多边形晶簇（左下角，出血裁切） -->
  <g stroke="#647c9f" stroke-opacity=".14" stroke-width="1.4" stroke-linejoin="round">
    <polygon points="118,1200 168,962 236,905 296,1200" fill="url(#oreFace)"/>
    <polygon points="236,905 296,1200 372,1200 322,948" fill="#7d93b5" fill-opacity=".05"/>
    <polygon points="296,860 322,948 236,905" fill="#8fa6c6" fill-opacity=".08"/>
    <polygon points="352,1200 418,1010 468,986 508,1200" fill="url(#oreFace)"/>
    <polygon points="468,986 508,1200 560,1200 516,1032" fill="#7d93b5" fill-opacity=".04"/>
    <polygon points="42,1200 74,1088 118,1064 142,1200" fill="#8fa6c6" fill-opacity=".06"/>
    <polygon points="118,1064 142,1200 118,1200 168,962 74,1088" fill="#6d84a8" fill-opacity=".04"/>
    <polygon points="560,1200 604,1092 646,1200" fill="url(#oreFace)"/>
    <polygon points="-30,1130 42,1104 74,1088 42,1200 -30,1200" fill="#7d93b5" fill-opacity=".05"/>
  </g>
  <!-- 矿石碎屑微粒（稀疏点缀） -->
  <g fill="#647c9f">
    <circle cx="332" cy="872" r="2.5" fill-opacity=".14"/>
    <circle cx="486" cy="964" r="2" fill-opacity=".11"/>
    <circle cx="196" cy="936" r="1.8" fill-opacity=".10"/>
    <circle cx="576" cy="1052" r="2.2" fill-opacity=".09"/>
    <circle cx="88" cy="1032" r="1.6" fill-opacity=".10"/>
  </g>

  <!-- 钢铁：工字钢截面 + 钢板叠层线稿（右上角，出血裁切） -->
  <g fill="none" stroke="#5f7290" stroke-opacity=".12" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"
     transform="rotate(-14 1660 210)">
    <path d="M1568 118h184v46h-56v150h56v46h-184v-46h56V164h-56z"/>
    <path d="M1600 96h120M1612 384h96" stroke-opacity=".09"/>
  </g>
  <g fill="none" stroke="#5f7290" stroke-opacity=".10" stroke-width="1.4" stroke-linecap="round">
    <path d="M1484 436 1848 322"/>
    <path d="M1500 470 1864 356"/>
    <path d="M1516 504 1880 390"/>
  </g>
  <!-- 钢卷弧线（极淡，右侧中下） -->
  <g fill="none" stroke="#5f7290" stroke-opacity=".07" stroke-width="1.4">
    <circle cx="1888" cy="812" r="132"/>
    <circle cx="1888" cy="812" r="92"/>
    <circle cx="1888" cy="812" r="52"/>
  </g>

  <!-- L3 细噪点（消除渐变色带） -->
  <rect width="1920" height="1200" filter="url(#grain)" opacity=".045"/>
</svg>
