<svg xmlns="http://www.w3.org/2000/svg">
<!--
  大宗矿产集采平台 · 功能图标系统（矢量源文件 / master sprite）
  ============================================================
  设计规范（与 Apple HIG / SF Symbols 对齐）：
    画布     16 x 16 viewBox（关键造型落在 1.5 ~ 14.5 安全区内）
    线宽     统一 1.4px（所有描边元素，无例外）
    端点     stroke-linecap = round
    拐角     stroke-linejoin = round
    圆角     矩形 rx ∈ {1.1, 1.3, 1.5, 1.7}（按形体大小取值，禁止直角）
    透视     正视扁平化，无等轴测 / 无渐变描边
    色彩     currentColor 单色模板（继承文本色；品牌蓝 #007AFF 由上下文赋予）
    填充     描边图标一律 fill="none"；仅 ic-logo 为填充型 evenodd 路径
    用法     <svg width="16" height="16"><use href="sprite.svg#ic-demand"/></svg>
  ============================================================
-->
  <symbol id="ic-demand" viewBox="0 0 16 16">
    <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
