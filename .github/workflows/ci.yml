name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖（校验 requirements 完整性）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python 语法门禁（backend + tests 全量编译）
        run: python -m compileall backend tests

      - name: 图标系统一致性校验（XML 级，截图部分自动跳过）
        run: python tests/ui_icons_validate.py
