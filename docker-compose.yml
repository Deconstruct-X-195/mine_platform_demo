# 大宗矿产集采平台一期 · PostgreSQL 14 数据库容器
# 用法：docker compose up -d
services:
  postgres:
    image: postgres:14
    container_name: mine-platform-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Langchain2026
      POSTGRES_DB: mine_platform
      # 业务时区（BUG-06 修复）：与后端会话时区（backend/db.py BUSINESS_TZ）保持一致，
      # 保证容器内 now() 日志与数据库时间函数均为北京时间
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - mine_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mine_platform"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mine_pg_data:
